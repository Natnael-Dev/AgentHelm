version: '3.8'

services:
  # ─── GO BAR DAEMON & SANDBOX RUNNER ──────────────────────────────────────────
  daemon:
    build:
      context: .
      dockerfile: core/daemon/Dockerfile
    container_name: agenthelm-daemon
    restart: unless-stopped
    volumes:
      - uds-socket:/tmp
      - ./workspace:/workspace
    environment:
      - AGENTHELM_ENV=development
      - AGENTHELM_SOCK=/tmp/agenthelm.sock
      - AGENTHELM_WORKSPACE=/workspace
    command: ["--session", "sess_docker_01", "--sock", "/tmp/agenthelm.sock"]
    networks:
      - agenthelm-net

  # ─── RUST TELEMETRY & DISPATCH ENGINE ───────────────────────────────────────
  telemetry:
    build:
      context: .
      dockerfile: telemetry/Dockerfile
    container_name: agenthelm-telemetry
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - uds-socket:/tmp
    environment:
      - RUST_LOG=info
      - AGENTHELM_SOCK=/tmp/agenthelm.sock
      - WS_BIND_ADDR=0.0.0.0:8765
    depends_on:
      - daemon
    networks:
      - agenthelm-net

  # ─── NODE.JS EXEORA MCP TUNNEL ──────────────────────────────────────────────
  mcp-tunnel:
    build:
      context: .
      dockerfile: extensions/mcp-tunnel/Dockerfile
    container_name: agenthelm-mcp-tunnel
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./workspace:/workspace
    environment:
      - PORT=9000
      - HOST=0.0.0.0
      - AGENTHELM_MCP_SECRET=agenthelm_master_secret_key_32b
    networks:
      - agenthelm-net

volumes:
  uds-socket:
    driver: local

networks:
  agenthelm-net:
    driver: bridge
